apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan
  namespace: {{ .Release.Namespace }}
spec:
  addresses:
    - {{ .Values.addressPool | quote }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: {{ .Release.Namespace }}
spec:
  ipAddressPools:
    - lan
